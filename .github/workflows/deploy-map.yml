# Builds the LikeC4 map and serves it from Cloudflare Workers, so nobody has to run a local server.
# Runs when the map changes on main. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
name: Deploy map

on:
  push:
    branches: [main]
    paths:
      - docs/architecture/**
      - .github/workflows/deploy-map.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-map
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npx -y likec4@1.59 build -o docs/architecture/dist --title "adslayer map" docs/architecture
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          workingDirectory: docs/architecture
          command: deploy
